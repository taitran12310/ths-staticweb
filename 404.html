<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Không tìm thấy trang — ThS HUIT.">
  <meta name="robots" content="noindex">
  <title>404 — Không tìm thấy | ThS HUIT</title>
  <link id="favicon" rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0f1419;
      --bg-elevated: #1a222c;
      --surface: #243040;
      --text: #e8eef4;
      --text-muted: #93a4b5;
      --accent: #3d9bfd;
      --accent-soft: rgba(61, 155, 253, 0.15);
      --border: rgba(232, 238, 244, 0.1);
      --radius: 12px;
      --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #1a3a5c 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 80%, #1a2f45 0%, transparent 45%),
        var(--bg);
      line-height: 1.6;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--accent);
      color: #fff;
      padding: 0.5rem 1rem;
      z-index: 100;
    }

    .skip-link:focus {
      left: 1rem;
      top: 1rem;
    }

    .error-card {
      width: min(520px, 100%);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.25rem 1.75rem 1.75rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .brand {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .error-code {
      margin: 0;
      font-size: clamp(4rem, 18vw, 6rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 0.9;
      background: linear-gradient(135deg, #3d9bfd, #7eb8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 {
      margin: 1rem 0 0.5rem;
      font-size: clamp(1.4rem, 4vw, 1.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 0 auto 1.25rem;
      color: var(--text-muted);
      max-width: 28rem;
    }

    .error-path {
      margin: 0 0 1.5rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      word-break: break-all;
      color: var(--text-muted);
      text-align: left;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.75rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }

    .btn:hover {
      text-decoration: none;
      transform: translateY(-1px);
    }

    .btn--primary {
      background: var(--accent);
      color: #041018;
      border: 1px solid transparent;
    }

    .btn--primary:hover {
      background: #5aadff;
    }

    .btn--ghost {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(61, 155, 253, 0.35);
    }

    .btn--ghost:hover {
      background: rgba(61, 155, 253, 0.25);
    }

    .foot {
      margin: 1.75rem 0 0;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>

  <main id="main-content" class="error-card">
    <span class="brand">ThS HUIT</span>
    <p class="error-code" aria-hidden="true">404</p>
    <h1>Không tìm thấy trang</h1>
    <p class="lead">Đường dẫn bạn vừa mở không tồn tại hoặc đã bị xóa.</p>
    <p id="error-path" class="error-path" hidden></p>
    <div class="actions">
      <a id="home-link" class="btn btn--primary" href="./">← Về trang menu</a>
    </div>
    <p class="foot">ThS HUIT · Lỗi 404</p>
  </main>

  <script>
    (function () {
      var root = "/";
      if (/\.github\.io$/i.test(location.hostname)) {
        var parts = location.pathname.split("/").filter(Boolean);
        if (parts.length) root = "/" + parts[0] + "/";
      }

      var home = document.getElementById("home-link");
      if (home) home.setAttribute("href", root);

      var favicon = document.getElementById("favicon");
      if (favicon) favicon.setAttribute("href", root + "favicon.svg");

      var pathEl = document.getElementById("error-path");
      if (pathEl) {
        pathEl.hidden = false;
        pathEl.textContent = "Đường dẫn: " + location.pathname;
      }
    })();
  </script>
</body>
</html>
