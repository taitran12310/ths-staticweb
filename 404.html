<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Không tìm thấy trang | ThS HUIT</title>
<meta name="description" content="Không tìm thấy trang — ThS HUIT.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("ths-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;

    // GitHub Pages trả trang này cho mọi đường dẫn sai → asset phải đi theo gốc site
    var root = "/";
    if (/\.github\.io$/i.test(location.hostname)) {
      var parts = location.pathname.split("/").filter(Boolean);
      if (parts.length) root = "/" + parts[0] + "/";
    }
    window.__THS_ROOT__ = root;
    document.write(
      '<link rel="icon" href="' + root + 'favicon.svg" type="image/svg+xml">' +
      '<link rel="apple-touch-icon" href="' + root + 'apple-touch-icon.png">' +
      '<link rel="stylesheet" href="' + root + 'css/site.css">' +
      '<script src="' + root + 'js/site.js" defer><\/script>'
    );
  })();
</script>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
</svg>
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>

<div class="error-top">
  <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Đổi giao diện sáng/tối">
    <svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
    <svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg>
  </button>
</div>

<main id="main-content" class="error-page">
  <div class="error-card">
    <img class="owl" data-root-src="assets/owl.webp" src="assets/owl.webp" width="120" height="120" alt="" decoding="async">
    <p class="error-code" aria-hidden="true">404</p>
    <h1>Không tìm thấy trang</h1>
    <p>Đường dẫn bạn vừa mở không tồn tại hoặc đã bị xoá.</p>
    <p id="error-path" class="error-path" hidden></p>
    <div class="error-actions">
      <a class="btn btn--coral" data-root-link href="./"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-home"/></svg>Về trang chủ</a>
      <button type="button" class="btn btn--soft" id="go-back"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-back"/></svg>Quay lại</button>
    </div>
  </div>
</main>

<script>
  (function () {
    var root = window.__THS_ROOT__ || "/";
    document.querySelectorAll("[data-root-link]").forEach(function (a) { a.setAttribute("href", root); });
    document.querySelectorAll("[data-root-src]").forEach(function (el) { el.setAttribute("src", root + el.getAttribute("data-root-src")); });

    var back = document.getElementById("go-back");
    if (back) {
      if (history.length > 1) back.addEventListener("click", function () { history.back(); });
      else back.hidden = true;
    }

    var pathEl = document.getElementById("error-path");
    if (pathEl) {
      pathEl.hidden = false;
      pathEl.textContent = "Đường dẫn: " + location.pathname;
    }
  })();
</script>
</body>
</html>
