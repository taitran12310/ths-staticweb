<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERD Studio — Buổi 9</title>
  <link rel="icon" type="image/png" href="assets/icons/erd.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Design system (ui-ux-pro-max): Dark Mode OLED · Developer tool
       Heading/mono: JetBrains Mono · Body: IBM Plex Sans · Accent: #22C55E */
    :root {
      --font-sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;
      --dur: 180ms;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    :root, html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1120;
      --surface: #0f172a;
      --surface2: #1b2336;
      --surface3: #272f42;
      --border: #334155;
      --border-strong: #475569;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --on-accent: #052e16;
      --accent-soft: rgba(34, 197, 94, .14);
      --ring: #4ade80;
      --dm: #0d1f1d;
      --dm-border: #14b8a6;
      --dm-title: #5eead4;
      --dm-head: rgba(20, 184, 166, .12);
      --biz: #111b2e;
      --biz-border: #3b82f6;
      --biz-title: #93c5fd;
      --biz-head: rgba(59, 130, 246, .12);
      --pk: #fbbf24;
      --fk: #a78bfa;
      --line: #64748b;
      --line-dm: #2dd4bf;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
      --shadow-float: 0 12px 32px rgba(0, 0, 0, .5), 0 0 0 1px rgba(148, 163, 184, .08);
      --glass: rgba(15, 23, 42, .82);
      --btn-hover: #273349;
      --chip-bg: #1b2336;
      --chip-fg: #e2e8f0;
      --chip-border: #475569;
      --edge-card-fill: #111b2e;
      --edge-card-stroke: #60a5fa;
      --edge-card-dm-fill: #0d1f1d;
      --edge-card-dm-stroke: #2dd4bf;
      --edge-card-text: #f8fafc;
      --edge-card-text-stroke: #0b1120;
      --grid-dot: rgba(148, 163, 184, .13);
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --surface3: #e2e8f0;
      --border: #cbd5e1;
      --border-strong: #94a3b8;
      --text: #0f172a;
      --muted: #475569;
      --accent: #16a34a;
      --on-accent: #ffffff;
      --accent-soft: rgba(22, 163, 74, .12);
      --ring: #15803d;
      --dm: #f0fdfa;
      --dm-border: #0d9488;
      --dm-title: #0f766e;
      --dm-head: rgba(13, 148, 136, .1);
      --biz: #f8fbff;
      --biz-border: #2563eb;
      --biz-title: #1e40af;
      --biz-head: rgba(37, 99, 235, .08);
      --pk: #a16207;
      --fk: #6d28d9;
      --line: #64748b;
      --line-dm: #0d9488;
      --shadow: 0 6px 18px rgba(15, 23, 42, .08);
      --shadow-float: 0 10px 28px rgba(15, 23, 42, .12), 0 0 0 1px rgba(15, 23, 42, .06);
      --glass: rgba(255, 255, 255, .88);
      --btn-hover: #e2e8f0;
      --chip-bg: #ffffff;
      --chip-fg: #1e3a8a;
      --chip-border: #94a3b8;
      --edge-card-fill: #ffffff;
      --edge-card-stroke: #2563eb;
      --edge-card-dm-fill: #f0fdfa;
      --edge-card-dm-stroke: #0d9488;
      --edge-card-text: #0f172a;
      --edge-card-text-stroke: #ffffff;
      --grid-dot: rgba(71, 85, 105, .16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; color: inherit; cursor: pointer; }

    :focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    /* Icon tự sinh: PNG alpha làm mask → tô theo currentColor, hợp cả 2 theme */
    .ico {
      display: inline-block;
      flex: none;
      width: 18px;
      height: 18px;
      background: currentColor;
      -webkit-mask: var(--ico) center / contain no-repeat;
      mask: var(--ico) center / contain no-repeat;
    }
    .ico.sm { width: 15px; height: 15px; }
    .ico.lg { width: 22px; height: 22px; }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
    }

    /* ---------- Header ---------- */
    header.app-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: .6rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .65rem;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius);
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    }

    .brand h1 {
      font-family: var(--font-mono);
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .brand p {
      font-size: .72rem;
      color: var(--muted);
      line-height: 1.3;
      white-space: nowrap;
    }

    /* Tabs dạng segmented control */
    .tabs {
      justify-self: center;
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 100%;
      overflow-x: auto;
    }

    .tabs button {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      min-height: 34px;
      padding: .35rem .85rem;
      font-size: .82rem;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 7px;
      white-space: nowrap;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
    }

    .tabs button .num {
      font-family: var(--font-mono);
      font-size: .7rem;
      font-weight: 600;
      opacity: .75;
    }

    .tabs button:hover:not([aria-selected="true"]) {
      color: var(--text);
      background: var(--btn-hover);
    }

    .tabs button[aria-selected="true"] {
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .25), inset 0 -2px 0 var(--accent);
    }

    .tabs button[aria-selected="true"] .ico { color: var(--accent); }

    .actions {
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      min-height: 36px;
      padding: .4rem .8rem;
      font-size: .8rem;
      font-weight: 500;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      white-space: nowrap;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
    }

    .btn:hover { background: var(--btn-hover); border-color: var(--border-strong); }
    .btn:active { transform: translateY(1px); }

    .btn.icon-only { width: 36px; padding: 0; }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
    }
    .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }

    /* ---------- Stage + canvas ---------- */
    .stage {
      position: relative;
      min-height: 0;
    }

    .viewport {
      position: absolute;
      inset: 0;
      overflow: auto;
      overscroll-behavior: contain;
      background-color: var(--bg);
      background-image: radial-gradient(var(--grid-dot) 1px, transparent 1.2px);
      background-size: 22px 22px;
      background-attachment: local;
      touch-action: pan-x pan-y;
    }

    .print-title { display: none; }

    .viewport.dragging-node {
      cursor: grabbing;
      overflow: hidden;
    }

    .scroll-sizer {
      position: relative;
      min-width: 100%;
      min-height: 100%;
    }

    .world {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .edges {
      position: absolute;
      left: 0;
      top: 0;
      overflow: visible;
      pointer-events: none;
    }

    .edge-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .95;
    }

    .edge-line.dm { stroke: var(--line-dm); stroke-dasharray: 5 4; opacity: .8; }

    .edge-label {
      fill: var(--muted);
      font-size: 10px;
      font-family: var(--font-sans);
      font-weight: 500;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 3.5px;
      pointer-events: none;
    }

    .edge-card {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      fill: var(--edge-card-text);
      paint-order: stroke;
      stroke: var(--edge-card-text-stroke);
      stroke-width: 3px;
    }

    .edge-card-bg {
      fill: var(--edge-card-fill);
      stroke: var(--edge-card-stroke);
      stroke-width: 1.2;
      rx: 4;
      ry: 4;
    }

    .edge-card-bg.dm {
      stroke: var(--edge-card-dm-stroke);
      fill: var(--edge-card-dm-fill);
    }

    /* ---------- Entity card ---------- */
    .entity {
      position: absolute;
      width: 210px;
      background: var(--biz);
      border: 1px solid var(--biz-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      user-select: none;
      cursor: grab;
      transition: box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }

    .entity:hover { box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--biz-border) 22%, transparent); }

    .entity.dm {
      width: 180px;
      background: var(--dm);
      border-color: var(--dm-border);
    }

    .entity.dm:hover { box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--dm-border) 22%, transparent); }

    .entity.dragging {
      cursor: grabbing;
      z-index: 20;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .5), 0 0 0 2px var(--accent);
      transition: none;
    }

    .entity-title {
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .5rem .65rem;
      font-family: var(--font-mono);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .01em;
      color: var(--biz-title);
      background: var(--biz-head);
      border-bottom: 1px solid color-mix(in srgb, var(--biz-border) 45%, transparent);
      border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
    }

    .entity-title::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 2px;
      background: var(--biz-border);
      flex: none;
    }

    .entity.dm .entity-title {
      color: var(--dm-title);
      background: var(--dm-head);
      border-bottom-color: color-mix(in srgb, var(--dm-border) 45%, transparent);
    }

    .entity.dm .entity-title::before { background: var(--dm-border); border-radius: 50%; }

    .entity-attrs {
      list-style: none;
      padding: .3rem 0 .35rem;
    }

    .entity-attrs li {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: .4rem;
      align-items: baseline;
      padding: .17rem .65rem;
      font-size: .68rem;
      font-family: var(--font-mono);
      color: var(--text);
      line-height: 1.35;
    }

    .entity-attrs li:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }

    .badge {
      font-size: .56rem;
      font-weight: 700;
      padding: .08rem .3rem;
      border-radius: 4px;
      letter-spacing: .04em;
    }

    .badge.pk { background: color-mix(in srgb, var(--pk) 18%, transparent); color: var(--pk); }
    .badge.fk { background: color-mix(in srgb, var(--fk) 18%, transparent); color: var(--fk); }
    .badge.attr { background: transparent; color: transparent; min-width: 1.45rem; }

    .attr-name { color: var(--text); overflow-wrap: anywhere; }
    .attr-type { color: var(--muted); font-size: .6rem; }

    /* ---------- Floating docks ---------- */
    .dock {
      position: absolute;
      z-index: 4;
      background: var(--glass);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-float);
    }

    .zoom-dock {
      right: 16px;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
    }

    .zoom-dock .sep {
      width: 1px;
      height: 22px;
      margin: 0 4px;
      background: var(--border);
    }

    .tool {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
    }

    .tool:hover { background: var(--btn-hover); color: var(--text); }
    .tool:active { transform: scale(.94); }

    .zoom-label {
      min-width: 3.4rem;
      height: 36px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      font-family: var(--font-mono);
      font-size: .76rem;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .zoom-label:hover { background: var(--btn-hover); }

    .legend-dock {
      left: 16px;
      bottom: 16px;
      max-width: min(360px, calc(100% - 32px));
      font-size: .74rem;
      color: var(--muted);
    }

    .legend-dock summary {
      display: flex;
      align-items: center;
      gap: .5rem;
      min-height: 40px;
      padding: .45rem .8rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      list-style: none;
      border-radius: var(--radius-lg);
    }
    .legend-dock summary::-webkit-details-marker { display: none; }
    .legend-dock summary .chev {
      margin-left: auto;
      font-family: var(--font-mono);
      color: var(--muted);
      transition: transform var(--dur) var(--ease);
    }
    .legend-dock[open] summary .chev { transform: rotate(180deg); }

    .legend-body {
      display: grid;
      gap: .7rem;
      padding: .1rem .85rem .8rem;
    }

    .legend-group h3 {
      font-family: var(--font-mono);
      font-size: .64rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: .4rem;
    }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem .8rem;
      color: var(--text);
    }

    .legend-row > span {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      white-space: nowrap;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1.5px solid;
    }
    .swatch.biz { background: var(--biz); border-color: var(--biz-border); }
    .swatch.dm { background: var(--dm); border-color: var(--dm-border); border-radius: 50%; }

    .card-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.5rem;
      padding: .05rem .3rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: .64rem;
      font-weight: 700;
      background: var(--chip-bg);
      color: var(--chip-fg);
      border: 1px solid var(--chip-border);
    }

    .gesture { color: var(--muted); }
    .gesture .ico { color: var(--accent); }

    .toast {
      position: fixed;
      top: 72px;
      left: 50%;
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--glass);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .5rem .9rem;
      border-radius: 999px;
      font-size: .8rem;
      box-shadow: var(--shadow-float);
      opacity: 0;
      transform: translate(-50%, -6px);
      transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
      pointer-events: none;
      z-index: 100;
    }
    .toast::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- Popup đề bài ---------- */
    .brief {
      width: min(720px, calc(100vw - 32px));
      max-height: min(80vh, 760px);
      margin: auto;
      padding: 0;
      display: none;
      flex-direction: column;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 64px rgba(0, 0, 0, .5);
      overflow: hidden;
    }
    .brief[open] { display: flex; animation: brief-in 200ms var(--ease); }
    .brief::backdrop {
      background: rgba(2, 6, 23, .6);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }
    @keyframes brief-in {
      from { opacity: 0; transform: translateY(8px) scale(.98); }
      to { opacity: 1; transform: none; }
    }

    .brief-head {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 1rem 1rem .75rem 1.25rem;
    }
    .brief-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      flex: none;
      border-radius: var(--radius);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .brief-heading { flex: 1; min-width: 0; }
    .brief-kicker {
      font-family: var(--font-mono);
      font-size: .66rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--accent);
    }
    .brief-heading h2 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
      text-wrap: balance;
    }

    .close-x {
      position: relative;
      width: 16px;
      height: 16px;
    }
    .close-x::before, .close-x::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
    }
    .close-x::before { transform: translate(-50%, -50%) rotate(45deg); }
    .close-x::after { transform: translate(-50%, -50%) rotate(-45deg); }

    .brief-tabs {
      display: flex;
      gap: .25rem;
      padding: 0 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .brief-tabs button {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      min-height: 38px;
      padding: .4rem .75rem;
      font-size: .8rem;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .brief-tabs button:hover { color: var(--text); }
    .brief-tabs button[aria-selected="true"] {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    .brief-tabs button[aria-selected="true"] .ico { color: var(--accent); }

    .brief-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1.1rem 1.25rem 1.25rem;
      font-size: .92rem;
      line-height: 1.7;
    }
    .brief-body p { max-width: 68ch; }
    .brief-body p + p { margin-top: .85rem; }
    .brief-body mark {
      color: inherit;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      border-radius: 3px;
      padding: 0 .15em;
    }

    .brief-foot {
      padding: .6rem 1.25rem;
      font-size: .72rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--surface2);
    }

    @media (max-width: 1100px) {
      .btn .label { display: none; }
      .btn:not(.icon-only) { width: 36px; padding: 0; }
    }

    @media (max-width: 860px) {
      header.app-header { grid-template-columns: 1fr auto; }
      .tabs { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; }
      .tabs button { flex: 1; justify-content: center; }
      .brand p { display: none; }
    }

    @media (max-width: 560px) {
      .tabs .tab-text { display: none; }
      .legend-dock { display: none; }
      .zoom-dock { right: 8px; bottom: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0ms !important;
        animation-duration: 0ms !important;
      }
    }

    @media print {
      html, body {
        height: auto !important;
        overflow: visible !important;
        background: #fff !important;
        color: #111 !important;
      }

      .app-header,
      .dock,
      .brief,
      .toast {
        display: none !important;
      }

      .app, .stage {
        display: block;
        height: auto;
      }

      .print-title {
        display: block;
        height: 36px;
        line-height: 36px;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 13pt;
        font-weight: 700;
        color: #111;
      }

      .viewport {
        position: static;
        overflow: visible !important;
        height: auto !important;
        background: #fff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .scroll-sizer {
        position: relative;
        overflow: hidden;
        min-width: 0 !important;
        min-height: 0 !important;
        margin-left: auto;
        margin-right: auto;
        break-inside: avoid;
      }

      .entity {
        box-shadow: none !important;
      }
    }

    const BRIEFS = {
      bai1: {
        title: "Hệ thống quản lý bán hàng cho cửa hàng điện thoại",
        paragraphs: [
          "Một cửa hàng chuyên bán điện thoại và phụ kiện muốn xây dựng hệ thống thông tin để quản lý hoạt động bán hàng hằng ngày. Mỗi ==sản phẩm== trong cửa hàng đều được lưu trong hệ thống với mã sản phẩm, tên, ==loại== (điện thoại, ốp lưng, sạc, tai nghe…), ==hãng sản xuất==, giá bán, số lượng tồn kho và trạng thái còn kinh doanh hay đã ngừng. Một số sản phẩm được nhập từ nhiều ==nhà cung cấp== khác nhau, mỗi nhà cung cấp có mã riêng, tên, địa chỉ, số điện thoại, email và người liên hệ chính. Khi phát sinh đợt nhập hàng, cửa hàng lập ==phiếu nhập== ghi rõ nhà cung cấp, ngày nhập, nhân viên phụ trách và danh sách các sản phẩm được nhập kèm số lượng, đơn giá nhập.",
          "Khách đến mua hàng sẽ được nhân viên bán hàng tạo ==hóa đơn==. Mỗi hóa đơn có mã số, ngày giờ lập, nhân viên lập hóa đơn và ==khách hàng== (nếu là khách quen đã có thông tin trong hệ thống). Khách hàng có thể là khách lẻ (chỉ lưu họ tên và số điện thoại) hoặc khách thân thiết (có thêm mã khách, địa chỉ, hạng thành viên). Một hóa đơn có thể chứa nhiều ==dòng chi tiết==, mỗi dòng tương ứng với một sản phẩm cụ thể, số lượng mua, đơn giá bán và mức giảm giá (nếu có). Từ dữ liệu chi tiết trên hóa đơn, hệ thống tự động trừ số lượng tồn kho của từng sản phẩm tương ứng.",
          "==Nhân viên== trong cửa hàng được phân quyền trong hệ thống; mỗi nhân viên có mã, họ tên, ==chức vụ== (thu ngân, bán hàng, quản lý), lương cơ bản, ngày vào làm. Một nhân viên có thể lập nhiều hóa đơn trong ngày, một hóa đơn chỉ do một nhân viên chịu trách nhiệm. Từ các thông tin này, hệ thống có thể thống kê doanh thu theo ngày, theo nhân viên, theo nhóm sản phẩm hoặc theo nhà cung cấp; đồng thời theo dõi lịch sử mua hàng của mỗi khách hàng để áp dụng chương trình khuyến mãi hay chăm sóc khách hàng thân thiết.",
        ],
      },
      bai2: {

    function estimateEntitySize(ent) {
      const w = ent.kind === "dm" ? 180 : 210;

    function measureEntitySizes() {
      const sizes = {};
      for (const el of entitiesEl.children) {
        sizes[el.dataset.id] = { w: el.offsetWidth, h: el.offsetHeight };

    /**
     * Cột cố định theo LAYOUT_COLUMNS, giữ thứ tự trong cột; lặp nhiều lượt để mỗi entity
     * canh giữa theo các entity liên kết ở cột khác, không bao giờ chồng lên nhau.
     */
    function computeSmartPositions(tab, measured) {
      const diagram = DIAGRAMS[tab];
      const columns = LAYOUT_COLUMNS[tab];
      const positions = {};
      if (!columns) {
        for (const e of diagram.entities) positions[e.id] = { x: e.x, y: e.y };
        return positions;
      }

      const sizes = {};
      for (const e of diagram.entities) {
        sizes[e.id] = (measured && measured[e.id]) || estimateEntitySize(e);
      }

      const adj = {};
      for (const e of diagram.entities) adj[e.id] = [];
      for (const edge of diagram.edges) {
        if (adj[edge.from] && adj[edge.to]) {
          adj[edge.from].push(edge.to);
          adj[edge.to].push(edge.from);
        }
      }

      const colIndex = {};
      columns.forEach((col, i) => col.forEach((id) => { colIndex[id] = i; }));

      const LEFT = 80, TOP = 90, COL_GAP = 110, ROW_GAP = 70, LANE = 16;
      // Khe giữa 2 cột giãn theo số đường nối phải đi qua khe đó
      const gapLoad = columns.map(() => 0);
      for (const edge of diagram.edges) {
        const a = colIndex[edge.from], b = colIndex[edge.to];
        if (a == null || b == null) continue;
        if (a === b) gapLoad[Math.min(a, columns.length - 2)] += 1;
        for (let g = Math.min(a, b); g < Math.max(a, b); g++) gapLoad[g] += 1;
      }
      const colX = [];
      const colW = [];
      let xCursor = LEFT;
      columns.forEach((col, i) => {
        colX[i] = xCursor;
        colW[i] = Math.max(...col.map((id) => sizes[id]?.w ?? 200));
        xCursor += colW[i] + Math.max(COL_GAP, 60 + gapLoad[i] * LANE);
      });

      const y = {};
      for (const col of columns) {
        let cursor = TOP;
        for (const id of col) {
          y[id] = cursor;
          cursor += sizes[id].h + ROW_GAP;
        }
      }
      const centerY = (id) => y[id] + sizes[id].h / 2;

      for (let iter = 0; iter < 12; iter++) {
        const order = columns.map((_, i) => i);
        if (iter % 2) order.reverse();
        for (const c of order) {
          const col = columns[c];
          let cursor = TOP;
          col.forEach((id, k) => {
            const cross = adj[id].filter((n) => colIndex[n] != null && colIndex[n] !== c);
            let desired;
            if (cross.length) {
              desired = cross.reduce((s, n) => s + centerY(n), 0) / cross.length - sizes[id].h / 2;
            } else {
              // Chỉ liên kết trong cùng cột: xếp sát ngay trên entity liên kết phía dưới
              const belowIdx = adj[id]
                .filter((n) => colIndex[n] === c)
                .map((n) => col.indexOf(n))
                .filter((j) => j > k)
                .sort((a, b) => a - b)[0];
              if (belowIdx != null) {
                let stack = 0;
                for (let j = k; j < belowIdx; j++) stack += sizes[col[j]].h + ROW_GAP;
                desired = y[col[belowIdx]] - stack;
              } else {
                desired = cursor;
              }
            }
            y[id] = Math.max(cursor, desired);
            cursor = y[id] + sizes[id].h + ROW_GAP;
          });
        }
      }

      const minY = Math.min(...Object.values(y));
      columns.forEach((col, c) => {
        for (const id of col) {
          if (!sizes[id]) continue;
          positions[id] = {
            x: Math.round(colX[c] + (colW[c] - sizes[id].w) / 2),
            y: Math.round(y[id] - minY + TOP),
          };
        }
      });
      for (const e of diagram.entities) {
        if (!positions[e.id]) positions[e.id] = { x: e.x, y: e.y };
      }
      return positions;
    }

      if (btnTheme) {
        btnTheme.innerHTML = `<i class="ico ico-${next === "dark" ? "moon" : "sun"}" aria-hidden="true"></i>`;
        btnTheme.setAttribute("aria-pressed", next === "light" ? "true" : "false");
        btnTheme.title = next === "dark" ? "Đang Dark — bấm để sang Light" : "Đang Light — bấm để sang Dark";
        btnTheme.setAttribute("aria-label", btnTheme.title);

      // Vẽ lại cạnh để màu marker theo theme

        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.tab && DIAGRAMS[data.tab]) state.tab = data.tab;
        if (data.layouts) state.layouts = data.layouts;
      } catch (_) { /* ignore */ }

      layout.scale = state.scale;

      layout.scrollTop = viewport.scrollTop;

      if (showToast) notify("Đã lưu layout vào localStorage");

    /** In / Xuất PDF qua hộp thoại Print → Save as PDF */
    function printPDF() {
      const prevTheme = currentTheme();
      const prevScroll = { left: viewport.scrollLeft, top: viewport.scrollTop };

      updatePrintTitle();
      applyTheme("light");

      // Cắt sát khung bao (entity + đường nối), chọn hướng giấy theo tỉ lệ, căn giữa
      const b = state.contentBounds;
      const PAD = 12;
      const bx = b.x1 - PAD, by = b.y1 - PAD;
      const bw = b.x2 - b.x1 + PAD * 2, bh = b.y2 - b.y1 + PAD * 2;
      const landscape = bw >= bh;
      const MM = 96 / 25.4;
      const MARGIN_MM = 8;
      const pageW = ((landscape ? 420 : 297) - MARGIN_MM * 2) * MM;
      const pageH = ((landscape ? 297 : 420) - MARGIN_MM * 2) * MM;
      const TITLE_H = 36;
      // trừ hao 2px để trình duyệt không đẩy sang trang thứ 2
      const availH = pageH - TITLE_H - 2;
      const s = Math.min(pageW / bw, availH / bh, 1.6);

      let pageStyle = document.getElementById("printPageStyle");
      if (!pageStyle) {
        pageStyle = document.createElement("style");
        pageStyle.id = "printPageStyle";
        document.head.appendChild(pageStyle);
      }
      pageStyle.textContent = `@page { size: A3 ${landscape ? "landscape" : "portrait"}; margin: ${MARGIN_MM}mm; }`;

      state.printing = true;
      world.style.transform = `translate(${-bx * s}px, ${-by * s}px) scale(${s})`;
      scrollSizer.style.width = `${bw * s}px`;
      scrollSizer.style.height = `${bh * s}px`;
      scrollSizer.style.marginTop = `${Math.max(0, (availH - bh * s) / 2)}px`;

      let done = false;
      const restore = () => {
        if (done) return;
        done = true;
        state.printing = false;
        scrollSizer.style.marginTop = "";
        applyTheme(prevTheme);
        applyTransform();
        viewport.scrollLeft = prevScroll.left;
        viewport.scrollTop = prevScroll.top;
        scheduleSave();
      };

      window.addEventListener("afterprint", restore, { once: true });
      const mql = window.matchMedia("print");
      const onPrintChange = (e) => {
        if (!e.matches) {
          restore();
          mql.removeEventListener?.("change", onPrintChange);
          mql.removeListener?.(onPrintChange);
        }
      };
      if (mql.addEventListener) mql.addEventListener("change", onPrintChange);
      else if (mql.addListener) mql.addListener(onPrintChange);

      notify("Chọn «Save as PDF» trong hộp thoại in");
      requestAnimationFrame(() => {
        requestAnimationFrame(() => window.print());
      });
    }

    function scheduleSave() {
      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(() => saveStorage(false), 400);

        card.addEventListener("pointerdown", onEntityPointerDown);

      if (layout.autoPending) {

        for (const card of entitiesEl.children) {

    function cardRect(id) {

        h: el.offsetHeight,

    /** Chọn cạnh neo ưu tiên theo vị trí tương đối (giảm cắt chéo). */
    function chooseSides(a, b) {
      const dx = b.cx - a.cx;
      const dy = b.cy - a.cy;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);
      // Cột kề nhau / lệch ngang rõ → luôn nối trái-phải
      if (absDx >= absDy * 0.55 || absDx > 180) {
        return {
          fromSide: dx >= 0 ? "right" : "left",
          toSide: dx >= 0 ? "left" : "right",
        };
      }
      return {
        fromSide: dy >= 0 ? "bottom" : "top",
        toSide: dy >= 0 ? "top" : "bottom",
      };
    }

    const SIDES = ["left", "right", "top", "bottom"];
    // Hướng di chuyển trên lưới: 0:+x 1:-x 2:+y 3:-y
    const OUT_DIR = { right: 0, left: 1, bottom: 2, top: 3 };
    const IN_DIR = { right: 1, left: 0, bottom: 3, top: 2 };
    const OPP_DIR = [1, 0, 3, 2];
    // inflate: vùng cấm quanh entity · stub: đoạn thẳng ra khỏi cạnh (chỗ vẽ ký hiệu 1/N)
    // keep: hệ số chi phí khi đi lại đúng đường cũ (< 1 → ưu tiên giữ nguyên)
    const ROUTE = { inflate: 16, stub: 28, outer: 34, bend: 45, reuse: 4, cross: 18, keep: 0.45 };

    function makePort(rect, side, t) {
      const PAD = 14;
      let x, y;
      if (side === "left" || side === "right") {
        x = side === "left" ? rect.x : rect.x + rect.w;
        y = rect.y + PAD + (rect.h - PAD * 2) * t;
      } else {
        x = rect.x + PAD + (rect.w - PAD * 2) * t;
        y = side === "top" ? rect.y : rect.y + rect.h;
      }
      x = Math.round(x);
      y = Math.round(y);
      const o = outward(side);
      return { side, x, y, ex: x + o.x * ROUTE.stub, ey: y + o.y * ROUTE.stub };
    }

    class MinHeap {
      constructor() { this.keys = []; this.vals = []; }
      get size() { return this.vals.length; }
      push(val, key) {
        const k = this.keys, v = this.vals;
        let i = v.length;
        k.push(key); v.push(val);
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (k[p] <= key) break;
          k[i] = k[p]; v[i] = v[p]; i = p;
        }
        k[i] = key; v[i] = val;
      }
      pop() {
        const k = this.keys, v = this.vals;
        const top = v[0];
        const lastK = k.pop(), lastV = v.pop();
        const n = v.length;
        if (n > 0) {
          let i = 0;
          for (;;) {
            let c = 2 * i + 1;
            if (c >= n) break;
            if (c + 1 < n && k[c + 1] < k[c]) c++;
            if (k[c] >= lastK) break;
            k[i] = k[c]; v[i] = v[c]; i = c;
          }
          k[i] = lastK; v[i] = lastV;
        }
        return top;
      }
    }

    function gridCoords(values) {
      values.sort((a, b) => a - b);
      const uniq = [];
      for (const v of values) {
        if (!uniq.length || v - uniq[uniq.length - 1] > 0.5) uniq.push(v);
      }
      // Thêm đường giữa mỗi khe để đường nối chạy giữa hành lang
      const out = [];
      for (let i = 0; i < uniq.length; i++) {
        out.push(uniq[i]);
        if (i < uniq.length - 1 && uniq[i + 1] - uniq[i] > 24) out.push((uniq[i] + uniq[i + 1]) / 2);
      }
      return out;
    }

    function nearestIndex(arr, v) {
      let lo = 0, hi = arr.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (arr[mid] < v) lo = mid + 1; else hi = mid;
      }
      if (lo > 0 && Math.abs(arr[lo - 1] - v) < Math.abs(arr[lo] - v)) lo--;
      return lo;
    }

    /**
     * Router trực giao: lưới thưa dựng từ biên entity (đã nới) + điểm cổng,
     * A* với phạt rẽ, phạt dùng lại đoạn đã có đường và phạt giao cắt.
     */
    function createRouter(rectList, points) {
      const inf = ROUTE.inflate;
      const obs = rectList.map((r) => [r.x - inf, r.y - inf, r.x + r.w + inf, r.y + r.h + inf]);
      let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
      for (const o of obs) {
        x1 = Math.min(x1, o[0]); y1 = Math.min(y1, o[1]);
        x2 = Math.max(x2, o[2]); y2 = Math.max(y2, o[3]);
      }
      const xsRaw = [x1 - ROUTE.outer, x2 + ROUTE.outer];
      const ysRaw = [y1 - ROUTE.outer, y2 + ROUTE.outer];
      for (const o of obs) { xsRaw.push(o[0], o[2]); ysRaw.push(o[1], o[3]); }
      for (const p of points) { xsRaw.push(p.x); ysRaw.push(p.y); }
      const xs = gridCoords(xsRaw);
      const ys = gridCoords(ysRaw);
      const NX = xs.length, NY = ys.length, N = NX * NY;

      // Biên vật cản luôn là toạ độ lưới → đánh dấu theo khoảng chỉ số, không cần quét cả lưới
      const blocked = new Uint8Array(N);
      const hBlk = new Uint8Array(N);
      const vBlk = new Uint8Array(N);
      for (const o of obs) {
        const ixa = nearestIndex(xs, o[0]), ixb = nearestIndex(xs, o[2]);
        const iya = nearestIndex(ys, o[1]), iyb = nearestIndex(ys, o[3]);
        for (let ix = ixa; ix <= ixb; ix++) {
          for (let iy = iya; iy <= iyb; iy++) {
            const id = ix * NY + iy;
            const inX = ix > ixa && ix < ixb, inY = iy > iya && iy < iyb;
            if (inX && inY) blocked[id] = 1;
            if (inY && ix < ixb) hBlk[id] = 1;
            if (inX && iy < iyb) vBlk[id] = 1;
          }
        }
      }
      const usedH = new Uint16Array(N);
      const usedV = new Uint16Array(N);
      const usedN = new Uint16Array(N);
      const nodeAt = (x, y) => nearestIndex(xs, x) * NY + nearestIndex(ys, y);
      const pointOf = (id) => ({ x: xs[(id / NY) | 0], y: ys[id % NY] });

      // Dùng chung bộ nhớ giữa các lần route; stamp thay cho fill() để bỏ qua dữ liệu cũ
      const S = N * 4;
      const g = new Float64Array(S);
      const prev = new Int32Array(S);
      const seen = new Uint32Array(S);
      const closed = new Uint32Array(S);
      const pref = new Uint32Array(N);
      let gen = 0;

      const walkPolyline = (pts, visit) => {
        for (let i = 0; i < pts.length - 1; i++) {
          let ix = nearestIndex(xs, pts[i].x), iy = nearestIndex(ys, pts[i].y);
          const tx = nearestIndex(xs, pts[i + 1].x), ty = nearestIndex(ys, pts[i + 1].y);
          if (i === 0) visit(ix * NY + iy, -1);
          while (ix !== tx || iy !== ty) {
            const from = ix * NY + iy;
            if (ix !== tx) ix += ix < tx ? 1 : -1;
            else iy += iy < ty ? 1 : -1;
            visit(ix * NY + iy, from);
          }
        }
      };

      /** preferPts: đường lần trước — đi lại đúng hành lang cũ được giảm chi phí để hình không nhảy */
      function route(starts, goals, preferPts) {
        gen++;
        if (preferPts) walkPolyline(preferPts, (id) => { pref[id] = gen; });
        const goalAt = new Map();
        for (const gl of goals) goalAt.set(nodeAt(gl.ex, gl.ey), gl);
        const goalXY = goals.map((gl) => [gl.ex, gl.ey]);
        const h = (id) => {
          const p = pointOf(id);
          let best = Infinity;
          for (const [gx, gy] of goalXY) best = Math.min(best, Math.abs(p.x - gx) + Math.abs(p.y - gy));
          return best;
        };
        const startAt = new Map();
        const heap = new MinHeap();
        for (const st of starts) {
          const id = nodeAt(st.ex, st.ey);
          if (goalAt.has(id)) continue;
          const s = id * 4 + OUT_DIR[st.side];
          const g0 = st.bias || 0;
          if (seen[s] === gen && g[s] <= g0) continue;
          startAt.set(id, st);
          seen[s] = gen;
          g[s] = g0;
          prev[s] = -1;
          heap.push(s, g0 + h(id));
        }

        let found = -1;
        while (heap.size) {
          const s = heap.pop();
          if (closed[s] === gen) continue;
          closed[s] = gen;
          const id = s >> 2, d = s & 3;
          if (goalAt.has(id)) { found = s; break; }
          const ix = (id / NY) | 0, iy = id % NY;
          for (let nd = 0; nd < 4; nd++) {
            if (nd === OPP_DIR[d]) continue;
            let nix = ix, niy = iy;
            if (nd === 0) nix++; else if (nd === 1) nix--; else if (nd === 2) niy++; else niy--;
            if (nix < 0 || niy < 0 || nix >= NX || niy >= NY) continue;
            const nid = nix * NY + niy;
            const low = Math.min(id, nid);
            const horiz = nd < 2;
            if (horiz ? hBlk[low] : vBlk[low]) continue;
            const goal = goalAt.get(nid);
            if (blocked[nid] && !goal) continue;
            const len = horiz ? Math.abs(xs[nix] - xs[ix]) : Math.abs(ys[niy] - ys[iy]);
            const used = horiz ? usedH[low] : usedV[low];
            const onPrev = pref[id] === gen && pref[nid] === gen;
            let cost = g[s] + len * (onPrev ? ROUTE.keep : 1 + used * ROUTE.reuse) + usedN[nid] * ROUTE.cross;
            if (nd !== d) cost += ROUTE.bend;
            if (goal) {
              if (nd !== IN_DIR[goal.side]) cost += ROUTE.bend;
              cost += goal.bias || 0;
            }
            const ns = nid * 4 + nd;
            if (seen[ns] !== gen || cost < g[ns]) {
              seen[ns] = gen;
              g[ns] = cost;
              prev[ns] = s;
              heap.push(ns, cost + h(nid));
            }
          }
        }
        if (found < 0) return null;

        const nodes = [];
        for (let s = found; s >= 0; s = prev[s]) nodes.push(s >> 2);
        if (!startAt.has(nodes[nodes.length - 1])) return null;
        nodes.reverse();
        return {
          start: startAt.get(nodes[0]),
          goal: goalAt.get(nodes[nodes.length - 1]),
          nodes,
          pts: nodes.map(pointOf),
        };
      }

      function commit(nodes) {
        for (let i = 0; i < nodes.length; i++) {
          usedN[nodes[i]]++;
          if (i === 0) continue;
          const a = nodes[i - 1], b = nodes[i];
          const low = Math.min(a, b);
          if (Math.abs(a - b) === 1) usedV[low]++; else usedH[low]++;
        }
      }

      /** Giữ chỗ quanh điểm cổng để đường khác không chạy đè lên ký hiệu 1/N */
      function reserve(pts) {
        for (const p of pts) usedN[nodeAt(p.x, p.y)] += 2;
      }

      /** Ghi nhận một đường đã có sẵn (toạ độ) vào lưới để đường mới tránh chạy đè */
      function commitPolyline(pts) {
        const nodes = [];
        walkPolyline(pts, (id) => nodes.push(id));
        commit(nodes);
      }

      return { route, commit, commitPolyline, reserve };
    }

    function simplifyPath(pts) {
      const out = [];
      const same = (a, b) => Math.abs(a - b) < 0.01;
      for (const p of pts) {
        const last = out[out.length - 1];
        if (last && same(last.x, p.x) && same(last.y, p.y)) continue;
        if (out.length >= 2) {
          const a = out[out.length - 2];
          if ((same(a.x, last.x) && same(last.x, p.x)) || (same(a.y, last.y) && same(last.y, p.y))) {
            out[out.length - 1] = p;
            continue;
          }
        }
        out.push(p);
      }
      return out;
    }

    /** Toạ độ vuông góc với cạnh neo tại chỗ đường rẽ đầu tiên — dùng để xếp slot cổng không cắt nhau */
    function turnKey(pts, side) {
      const alongY = side === "left" || side === "right";
      const base = alongY ? pts[0].y : pts[0].x;
      for (const p of pts) {
        const v = alongY ? p.y : p.x;
        if (Math.abs(v - base) > 0.5) return v;
      }
      return base;
    }

    function labelAnchor(pts) {
      let best = [pts[0], pts[1] || pts[0]];
      let bestLen = -1;
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const len = Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
        if (len > bestLen) { bestLen = len; best = [a, b]; }
      }
      const [a, b] = best;
      if (Math.abs(a.y - b.y) < 0.5) {
        return { x: (a.x + b.x) / 2, y: a.y - 6, anchor: "middle" };
      }
      return { x: a.x + 6, y: (a.y + b.y) / 2 + 3, anchor: "start" };
    }

    function roundedPath(pts, r) {
      if (pts.length < 2) return "";
      let d = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 1; i < pts.length - 1; i++) {
        const prev = pts[i - 1];
        const cur = pts[i];
        const next = pts[i + 1];
        const v1x = cur.x - prev.x;
        const v1y = cur.y - prev.y;
        const v2x = next.x - cur.x;
        const v2y = next.y - cur.y;
        const len1 = Math.hypot(v1x, v1y) || 1;
        const len2 = Math.hypot(v2x, v2y) || 1;
        const rr = Math.min(r, len1 / 2, len2 / 2);
        const pA = { x: cur.x - (v1x / len1) * rr, y: cur.y - (v1y / len1) * rr };
        const pB = { x: cur.x + (v2x / len2) * rr, y: cur.y + (v2y / len2) * rr };
        d += ` L ${pA.x} ${pA.y} Q ${cur.x} ${cur.y} ${pB.x} ${pB.y}`;
      }
      const last = pts[pts.length - 1];
      d += ` L ${last.x} ${last.y}`;
      return d;
    }

    function scheduleDraw() {
      if (state.drawPending) return;
      state.drawPending = true;
      requestAnimationFrame(() => {
        state.drawPending = false;
        drawEdges(state.drag ? { dragId: state.drag.id } : undefined);
      });
    }

    /** Kích thước card không đổi khi kéo → đo một lần, tránh ép trình duyệt tính layout mỗi frame */
    function measureCards() {
      state.sizeCache = {};
      for (const el of entitiesEl.children) {
        state.sizeCache[el.dataset.id] = { w: el.offsetWidth, h: el.offsetHeight };
      }
    }

    function routeMemo() {
      if (!state.routeMemo || state.routeMemo.tab !== state.tab) {
        state.routeMemo = { tab: state.tab, byIndex: new Map() };
      }
      return state.routeMemo.byIndex;
    }

    function pathHitsRect(pts, r) {
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const minX = Math.min(a.x, b.x), maxX = Math.max(a.x, b.x);
        const minY = Math.min(a.y, b.y), maxY = Math.max(a.y, b.y);
        if (maxX > r.x1 && minX < r.x2 && maxY > r.y1 && minY < r.y2) return true;
      }
      return false;
    }

    // Phạt đổi cạnh neo so với lần vẽ trước → đường không nhảy qua lại khi card nhích nhẹ
    const SIDE_SWITCH = 140;

    /**
     * opts.dragId: đang kéo entity này → chỉ định tuyến lại các cạnh bị ảnh hưởng,
     * các cạnh khác giữ nguyên đường cũ để hình ổn định và nhẹ.
     */
    function drawEdges(opts = {}) {
      const diagram = DIAGRAMS[state.tab];
      if (!state.sizeCache || entitiesEl.children.length !== Object.keys(state.sizeCache).length) measureCards();
      const rects = {};
      for (const ent of diagram.entities) {
        const size = state.sizeCache[ent.id];
        if (!size) continue;
        const pos = getEntityPos(ent.id);
        rects[ent.id] = { x: pos.x, y: pos.y, w: size.w, h: size.h, cx: pos.x + size.w / 2, cy: pos.y + size.h / 2 };
      }
      const rectList = Object.values(rects);
      const memo = routeMemo();

      // Định tuyến cạnh ngắn trước để chúng lấy đường thẳng; cạnh dài đi vòng sau
      const items = [];
      diagram.edges.forEach((edge, i) => {
        const a = rects[edge.from];
        const b = rects[edge.to];
        if (a && b) items.push({ edge, i, a, b, prev: memo.get(i), dist: Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy) });
      });
      items.sort((u, v) => u.dist - v.dist || u.i - v.i);

      const dragId = opts.dragId;
      if (dragId && rects[dragId]) {
        const r = rects[dragId], m = ROUTE.inflate;
        const zone = { x1: r.x - m, y1: r.y - m, x2: r.x + r.w + m, y2: r.y + r.h + m };
        for (const it of items) {
          it.dirty = !it.prev || it.edge.from === dragId || it.edge.to === dragId || pathHitsRect(it.prev.pts, zone);
        }
      } else {
        for (const it of items) it.dirty = true;
      }

      // Lượt 1: thử cả 4 cạnh của mỗi entity (cổng ở giữa) để chọn cạnh neo tốt nhất
      const centerPorts = new Map();
      const pass1Pts = [];
      for (const [id, r] of Object.entries(rects)) {
        const ports = SIDES.map((side) => makePort(r, side, 0.5));
        centerPorts.set(id, ports);
        for (const p of ports) pass1Pts.push({ x: p.ex, y: p.ey });
      }
      const router1 = createRouter(rectList, pass1Pts);
      const withBias = (ports, prevSide) =>
        prevSide ? ports.map((p) => ({ ...p, bias: p.side === prevSide ? 0 : SIDE_SWITCH })) : ports;
      for (const it of items) {
        if (!it.dirty) {
          Object.assign(it, {
            fromSide: it.prev.fromSide, toSide: it.prev.toSide,
            fromKey: it.prev.fromKey, toKey: it.prev.toKey,
          });
          continue;
        }
        const res = router1.route(
          withBias(centerPorts.get(it.edge.from), it.prev?.fromSide),
          withBias(centerPorts.get(it.edge.to), it.prev?.toSide),
          it.prev?.pts
        );
        if (res) {
          router1.commit(res.nodes);
          it.fromSide = res.start.side;
          it.toSide = res.goal.side;
          it.fromKey = turnKey(res.pts, it.fromSide);
          it.toKey = turnKey(res.pts.slice().reverse(), it.toSide);
        } else {
          const s = chooseSides(it.a, it.b);
          it.fromSide = s.fromSide;
          it.toSide = s.toSide;
          it.fromKey = s.fromSide === "left" || s.fromSide === "right" ? it.b.cy : it.b.cx;
          it.toKey = s.toSide === "left" || s.toSide === "right" ? it.a.cy : it.a.cx;
        }
      }

      // Chia slot cổng trên từng cạnh entity theo hướng đường rẽ → không bắt chéo tại cổng
      const groups = new Map();
      const addSlot = (entityId, side, it, end, key) => {
        const k = `${entityId}|${side}`;
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push({ it, end, key });
      };
      for (const it of items) {
        addSlot(it.edge.from, it.fromSide, it, "from", it.fromKey);
        addSlot(it.edge.to, it.toSide, it, "to", it.toKey);
      }
      for (const [, list] of groups) {
        list.sort((u, v) => u.key - v.key || u.it.i - v.it.i);
        list.forEach((entry, idx) => {
          const t = (idx + 1) / (list.length + 1);
          if (entry.end === "from") entry.it.p1 = makePort(entry.it.a, entry.it.fromSide, t);
          else entry.it.p2 = makePort(entry.it.b, entry.it.toSide, t);
        });
      }

      // Cạnh giữ nguyên nhưng cổng bị dời (do số đường trên cạnh entity thay đổi) → phải tính lại
      const samePort = (p, q) => q && p.side === q.side && p.x === q.x && p.y === q.y;
      for (const it of items) {
        if (!it.dirty && !(samePort(it.p1, it.prev.p1) && samePort(it.p2, it.prev.p2))) it.dirty = true;
      }

      // Lượt 2: định tuyến thật với cổng cố định
      const exits = [];
      for (const it of items) exits.push({ x: it.p1.ex, y: it.p1.ey }, { x: it.p2.ex, y: it.p2.ey });
      const router2 = createRouter(rectList, exits);
      router2.reserve(exits);
      for (const it of items) if (!it.dirty) router2.commitPolyline(it.prev.pts);

      let bx1 = Infinity, by1 = Infinity, bx2 = -Infinity, by2 = -Infinity;
      const grow = (x, y, m = 0) => {
        bx1 = Math.min(bx1, x - m); by1 = Math.min(by1, y - m);
        bx2 = Math.max(bx2, x + m); by2 = Math.max(by2, y + m);
      };
      for (const r of rectList) { grow(r.x, r.y); grow(r.x + r.w, r.y + r.h); }

      for (const it of items) {
        if (!it.dirty) {
          it.pts = it.prev.pts;
        } else {
          const res = router2.route([it.p1], [it.p2], it.prev?.pts);
          let mid;
          if (res) {
            router2.commit(res.nodes);
            mid = res.pts;
          } else {
            mid = [{ x: it.p1.ex, y: it.p1.ey }, { x: it.p2.ex, y: it.p1.ey }, { x: it.p2.ex, y: it.p2.ey }];
          }
          it.pts = simplifyPath([{ x: it.p1.x, y: it.p1.y }, ...mid, { x: it.p2.x, y: it.p2.y }]);
        }
        for (const p of it.pts) grow(p.x, p.y, 24);
        memo.set(it.i, {
          fromSide: it.fromSide, toSide: it.toSide,
          fromKey: it.fromKey, toKey: it.toKey,
          p1: it.p1, p2: it.p2, pts: it.pts,
        });
      }

      if (!isFinite(bx1)) { bx1 = 0; by1 = 0; bx2 = 1200; by2 = 900; }
      state.contentBounds = { x1: bx1, y1: by1, x2: bx2, y2: by2 };
      const maxX = Math.max(1200, bx2 + 80);
      const maxY = Math.max(900, by2 + 80);
      if (maxX !== state.contentW || maxY !== state.contentH || !dragId) {
        edgesSvg.setAttribute("width", maxX);
        edgesSvg.setAttribute("height", maxY);
        state.contentW = maxX;
        state.contentH = maxY;
        applyTransform();
      }

      const lineDm = themeColor("--line-dm", "#3d8a68");
      const lineBiz = themeColor("--biz-title", "#7eb6f0");
      const lines = [];
      const marks = [];
      const labels = [];
      for (const it of items) {
        const cls = it.edge.dm ? "edge-line dm" : "edge-line";
        const color = it.edge.dm ? lineDm : lineBiz;
        const fromCard = it.edge.fromCard || "1";
        const toCard = it.edge.toCard || "0..N";
        lines.push(`<path class="${cls}" d="${roundedPath(it.pts, 8)}" />`);
        marks.push(
          cardinalityMarker(it.p1, it.fromSide, fromCard, color),
          cardinalityMarker(it.p2, it.toSide, toCard, color),
          cardChip(it.p1, it.fromSide, fromCard, it.edge.dm),
          cardChip(it.p2, it.toSide, toCard, it.edge.dm)
        );
        const la = labelAnchor(it.pts);
        labels.push(
          `<text class="edge-label" x="${la.x}" y="${la.y}" text-anchor="${la.anchor}">${escapeXml(it.edge.label)}</text>`
        );
      }
      edgesSvg.innerHTML = lines.join("") + marks.join("") + labels.join("");
    }

    /** Vector hướng ra ngoài từ cạnh entity */
    function outward(side) {
      if (side === "left") return { x: -1, y: 0 };
      if (side === "right") return { x: 1, y: 0 };
      if (side === "top") return { x: 0, y: -1 };
      return { x: 0, y: 1 };
    }

    function perp(side) {
      const o = outward(side);
      return { x: -o.y, y: o.x };
    }

    /**
     * Crow's foot / bar / circle tại đầu nối.
     * card: "1" | "0..1" | "0..N" | "1..N" | "N"
     */
    function cardinalityMarker(p, side, card, color) {
      const o = outward(side);
      const q = perp(side);
      const base = 10; // khoảng cách từ mép entity
      const bx = p.x + o.x * base;
      const by = p.y + o.y * base;
      const stroke = `stroke="${color}" stroke-width="1.8" fill="none" stroke-linecap="round"`;
      const parts = [];

      const hasMany = card === "N" || card === "0..N" || card === "1..N";
      const hasOne = card === "1" || card === "1..N" || card === "0..1";
      const hasZero = card === "0..1" || card === "0..N";

      let cursor = 0; // dọc theo hướng ra ngoài

      if (hasMany) {
        // Crow's foot: đỉnh trên đường nối, 3 ngón chạm entity (phía many)
        const tipX = bx + o.x * 10;
        const tipY = by + o.y * 10;
        const spread = 7;
        parts.push(
          `<line ${stroke} x1="${tipX}" y1="${tipY}" x2="${p.x + q.x * spread}" y2="${p.y + q.y * spread}" />`,
          `<line ${stroke} x1="${tipX}" y1="${tipY}" x2="${p.x}" y2="${p.y}" />`,
          `<line ${stroke} x1="${tipX}" y1="${tipY}" x2="${p.x - q.x * spread}" y2="${p.y - q.y * spread}" />`
        );
        cursor += 12;
      }

      if (hasOne) {
        // Thanh dọc | (vuông góc với đường nối)
        const cx = bx + o.x * cursor;
        const cy = by + o.y * cursor;
        const half = 6;
        parts.push(
          `<line ${stroke} x1="${cx + q.x * half}" y1="${cy + q.y * half}" x2="${cx - q.x * half}" y2="${cy - q.y * half}" />`
        );
        // Với "1" thuần: thêm thanh thứ 2 (||)
        if (card === "1") {
          const cx2 = bx + o.x * (cursor + 4);
          const cy2 = by + o.y * (cursor + 4);
          parts.push(
            `<line ${stroke} x1="${cx2 + q.x * half}" y1="${cy2 + q.y * half}" x2="${cx2 - q.x * half}" y2="${cy2 - q.y * half}" />`
          );
          cursor += 8;
        } else {
          cursor += 5;
        }
      }

      if (hasZero) {
        const cx = bx + o.x * (cursor + 4);
        const cy = by + o.y * (cursor + 4);
        parts.push(`<circle ${stroke} cx="${cx}" cy="${cy}" r="3.5" />`);
      }

      return parts.join("");
    }

    /** Nhãn số 0 / 1 / N rõ ràng gần đầu nối */
    function cardChip(p, side, card, isDm) {
      const o = outward(side);
      const q = perp(side);
      // Đặt chip lệch ra khỏi đường nối một chút
      const ox = p.x + o.x * 22 + q.x * 14;
      const oy = p.y + o.y * 22 + q.y * 14;
      const text = shortCard(card);
      const w = text.length <= 1 ? 16 : text.length <= 3 ? 28 : 34;
      const h = 14;
      const bgClass = isDm ? "edge-card-bg dm" : "edge-card-bg";
      return [
        `<rect class="${bgClass}" x="${ox - w / 2}" y="${oy - h / 2}" width="${w}" height="${h}" />`,
        `<text class="edge-card" x="${ox}" y="${oy + 3.5}" text-anchor="middle">${escapeXml(text)}</text>`,
      ].join("");
    }

    function shortCard(card) {
      if (card === "0..1") return "0..1";
      if (card === "0..N") return "0..N";
      if (card === "1..N") return "1..N";
      if (card === "N") return "N";
      return "1";
    }

    function escapeXml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    function onEntityPointerDown(e) {
      if (e.button !== 0) return;
      e.stopPropagation();
      e.preventDefault();
      const card = e.currentTarget;
      const id = card.dataset.id;
      const pos = getEntityPos(id);
      state.drag = {
        id,
        card,
        startX: e.clientX,
        startY: e.clientY,
        origX: pos.x,
        origY: pos.y,
      };
      card.classList.add("dragging");
      viewport.classList.add("dragging-node");
      card.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e) {
      if (!state.drag) return;
      const dx = (e.clientX - state.drag.startX) / state.scale;
      const dy = (e.clientY - state.drag.startY) / state.scale;
      const x = state.drag.origX + dx;
      const y = state.drag.origY + dy;
      state.drag.card.style.left = `${x}px`;
      state.drag.card.style.top = `${y}px`;
      setEntityPos(state.drag.id, x, y);
      scheduleDraw();
    }

    function onPointerUp(e) {
      if (!state.drag) return;
      state.drag.card.classList.remove("dragging");
      state.drag.card.releasePointerCapture?.(e.pointerId);
      state.drag = null;
      viewport.classList.remove("dragging-node");
      // Thả card → định tuyến lại toàn bộ (vẫn ưu tiên cạnh neo cũ nên không nhảy mạnh)
      drawEdges();
      scheduleSave();
    }

    /** Zoom quanh điểm con trỏ; giữ vị trí thế giới dưới con trỏ ổn định. */
    function zoomAt(factor, clientX, clientY) {
      const rect = viewport.getBoundingClientRect();
      const mx = clientX - rect.left;
      const my = clientY - rect.top;
      const old = state.scale;
      const next = Math.min(2.5, Math.max(0.35, old * factor));
      if (next === old) return;

      const worldX = (viewport.scrollLeft + mx) / old;
      const worldY = (viewport.scrollTop + my) / old;
      state.scale = next;
      applyTransform();
      viewport.scrollLeft = worldX * next - mx;
      viewport.scrollTop = worldY * next - my;
      scheduleSave();
    }

    function zoomTowardCenter(factor) {
      const rect = viewport.getBoundingClientRect();
      zoomAt(factor, rect.left + rect.width / 2, rect.top + rect.height / 2);
    }

    function fitView() {
      const b = state.contentBounds;
      if (!b) return;
      const minX = b.x1, minY = b.y1, maxX = b.x2, maxY = b.y2;
      const pad = 24;
      const DOCK_H = 64;
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight - DOCK_H;
      const bw = maxX - minX + pad * 2;
      const bh = maxY - minY + pad * 2;
      const s = Math.min(1.15, Math.max(0.35, Math.min(vw / bw, vh / bh)));
      state.scale = s;
      applyTransform();
      viewport.scrollLeft = (minX - pad) * s;
      viewport.scrollTop = (minY - pad) * s;
      scheduleSave();
    }

    function switchTab(tab) {
      saveStorage(false);
      state.tab = tab;
      document.querySelectorAll(".tabs [role=tab]").forEach((btn) => {
        btn.setAttribute("aria-selected", btn.dataset.tab === tab ? "true" : "false");
      });
      showLayout(ensureLayout(tab));
      updatePrintTitle();
      saveStorage(false);
    }

    function showLayout(layout) {
      const fresh = !!layout.autoPending;
      state.freshTab = fresh ? state.tab : null;
      viewport.setAttribute("aria-labelledby", `tab-${state.tab}`);
      state.scale = layout.scale ?? 1;
      renderEntities();
      if (fresh) {
        fitView();
      } else {
        applyTransform();
        restoreScroll(layout);
      }
    }

    function resetLayout() {
      state.layouts[state.tab] = defaultLayout(state.tab);
      renderEntities();
      fitView();
      saveStorage(false);
      notify("Đã reset layout");
    }

    // Events — chỉ kéo entity, không pan bằng kéo nền
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);

    /**
     * Mac trackpad:
     * - 2 ngón cuộn → wheel (không ctrl) → scroll native
     * - Pinch → wheel + ctrlKey (Chrome/Safari/Edge) → zoom
     */
    viewport.addEventListener("wheel", (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        // deltaY của pinch thường khá lớn; chuẩn hóa nhẹ
        const intensity = Math.min(Math.abs(e.deltaY), 40);
        const step = 1 + intensity * 0.008;
        const factor = e.deltaY < 0 ? step : 1 / step;
        zoomAt(factor, e.clientX, e.clientY);
      }
      // không ctrl → để trình duyệt scroll trái/phải/lên/xuống
    }, { passive: false });

    // Safari gesture pinch (bổ sung)
    viewport.addEventListener("gesturestart", (e) => {
      e.preventDefault();
      state.gestureBaseScale = state.scale;
    }, { passive: false });

    viewport.addEventListener("gesturechange", (e) => {
      e.preventDefault();
      const target = Math.min(2.5, Math.max(0.35, state.gestureBaseScale * e.scale));
      const factor = target / state.scale;
      if (Math.abs(factor - 1) < 0.001) return;
      zoomAt(factor, e.clientX || (viewport.getBoundingClientRect().left + viewport.clientWidth / 2),
        e.clientY || (viewport.getBoundingClientRect().top + viewport.clientHeight / 2));
    }, { passive: false });

    viewport.addEventListener("gestureend", (e) => {
      e.preventDefault();
      scheduleSave();
    }, { passive: false });

    viewport.addEventListener("scroll", () => {
      if (!state.drag) scheduleSave();
    }, { passive: true });

    window.addEventListener("keydown", (e) => {
      if (briefDialog.open) return;
      if ((e.key === "+" || e.key === "=") && !e.metaKey && !e.ctrlKey) {
        zoomTowardCenter(1.1);
      }
      if (e.key === "-" || e.key === "_") {
        zoomTowardCenter(1 / 1.1);
      }
    });

    window.addEventListener("resize", () => {
      measureCards();
      drawEdges();
    });

    document.getElementById("btnZoomIn").addEventListener("click", () => zoomTowardCenter(1.15));
    document.getElementById("btnZoomOut").addEventListener("click", () => zoomTowardCenter(1 / 1.15));
    document.getElementById("btnFit").addEventListener("click", fitView);
    document.getElementById("btnAutoLayout").addEventListener("click", applyAutoLayout);
    document.getElementById("btnReset").addEventListener("click", resetLayout);
    document.getElementById("btnSave").addEventListener("click", () => saveStorage(true));
    document.getElementById("btnTheme").addEventListener("click", toggleTheme);
    document.getElementById("btnPrint").addEventListener("click", printPDF);
    zoomLabel.addEventListener("click", () => zoomTowardCenter(1 / state.scale));

    const briefDialog = document.getElementById("briefDialog");
    const briefBody = document.getElementById("briefBody");

    function showBrief(tab) {
      const brief = BRIEFS[tab];
      if (!brief) return;
      document.getElementById("briefKicker").textContent = `Đề bài · Bài ${tab.slice(-1)}`;
      document.getElementById("briefTitle").textContent = brief.title;
      briefBody.innerHTML = brief.paragraphs
        .map((p) => `<p>${escapeXml(p).replace(/==(.+?)==/g, "<mark>$1</mark>")}</p>`)
        .join("");
      briefBody.scrollTop = 0;
      briefDialog.querySelectorAll(".brief-tabs [role=tab]").forEach((btn) => {
        btn.setAttribute("aria-selected", btn.dataset.brief === tab ? "true" : "false");
      });
    }

    function openBrief() {
      showBrief(state.tab);
      if (!briefDialog.open) briefDialog.showModal();
    }

    document.getElementById("btnBrief").addEventListener("click", openBrief);
    document.getElementById("btnBriefClose").addEventListener("click", () => briefDialog.close());
    briefDialog.addEventListener("click", (e) => {
      if (e.target === briefDialog) briefDialog.close();
    });
    briefDialog.querySelectorAll(".brief-tabs [role=tab]").forEach((btn) => {
      btn.addEventListener("click", () => showBrief(btn.dataset.brief));
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "?" && !briefDialog.open) {
        e.preventDefault();
        openBrief();
      }
    });

    const legendDock = document.getElementById("legendDock");
    legendDock.open = localStorage.getItem(LEGEND_KEY) === "open";
    legendDock.addEventListener("toggle", () => {
      localStorage.setItem(LEGEND_KEY, legendDock.open ? "open" : "closed");
    });

    document.querySelectorAll(".tabs [role=tab]").forEach((btn) => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    window.addEventListener("beforeunload", () => saveStorage(false));

    // Init — storage key mới → layout thông minh; nếu thiếu vị trí thì tính lại
    loadTheme();
    loadStorage();
    document.querySelectorAll(".tabs [role=tab]").forEach((btn) => {
      btn.setAttribute("aria-selected", btn.dataset.tab === state.tab ? "true" : "false");
    });
    let layout = ensureLayout(state.tab);
    const expectedIds = DIAGRAMS[state.tab].entities.map((e) => e.id);
    const missing = expectedIds.some((id) => !layout.positions?.[id]);
    if (missing || Object.keys(layout.positions || {}).length < expectedIds.length) {
      layout = defaultLayout(state.tab);
      state.layouts[state.tab] = layout;
    }
    showLayout(layout);
    updatePrintTitle();
    // Font web đổi kích thước card → layout vừa tự tính thì tính lại theo kích thước thật
    document.fonts?.ready.then(() => {
      const cur = ensureLayout(state.tab);
      if (state.freshTab === state.tab) {
        cur.autoPending = true;
        showLayout(cur);
      } else {
        measureCards();
        drawEdges();
      }
    });
  </script>
</body>
</html>
