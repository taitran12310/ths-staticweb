<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trang tổng hợp tài liệu Thạc sĩ HUIT — menu các môn học và đồ án.">
  <title>ThS HUIT — Menu tài liệu</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

</head>
<body>

          <li class="menu__status" role="status">Đang tải menu…</li>

    <footer class="site-footer">
      <p data-bind="footer">Deploy bằng GitHub Pages — thư mục gốc chứa <code>index.html</code>.</p>
    </footer>
  </div>

  <script src="js/menu.js" defer></script>

</html>
