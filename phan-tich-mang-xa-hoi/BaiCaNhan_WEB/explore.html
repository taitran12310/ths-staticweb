<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>CineInfo — Kho phim &amp; diễn viên</title>
  <link rel="icon" href="favicon.svg?v=logo1" type="image/svg+xml" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("tmdb-sna-theme");
        var pref = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", saved || pref);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css?v=ui9" />
  <link rel="stylesheet" href="explore.css?v=ui7" />
</head>
<body data-page="explore" class="cine-body">
  <a class="skip-link" href="#browseMain">Bỏ qua điều hướng</a>

  <header class="cine-header">
    <div class="cine-header-top">
      <a class="course-back" href="../index.html" aria-label="Quay lại danh sách môn"><span aria-hidden="true">←</span><span>Quay lại</span></a>
      <a class="cine-logo" href="explore.html" aria-label="CineInfo trang chủ">
        <img class="cine-logo-mark" src="favicon.svg?v=logo1" alt="" width="34" height="34" />
        <span class="cine-logo-text">CineInfo</span>
      </a>
      <nav class="cine-nav" aria-label="Chính">
        <a href="explore.html" aria-current="page">Kho phim</a>
        <a href="index.html">Đồ thị SNA</a>
      </nav>
      <form class="cine-filters" id="filterForm">
        <label class="sr-only" for="filterGenre">Thể loại</label>
        <select id="filterGenre">
          <option value="">Thể loại</option>
        </select>
        <label class="sr-only" for="filterCountry">Quốc gia</label>
        <select id="filterCountry">
          <option value="">Quốc gia</option>
          <option value="us">Mỹ</option>
          <option value="gb">Anh</option>
          <option value="vn">Việt Nam</option>
          <option value="kr">Hàn Quốc</option>
        </select>
        <label class="sr-only" for="filterYear">Năm sản xuất</label>
        <select id="filterYear">
          <option value="">Năm sản xuất</option>
          <option value="2020">2020–2029</option>
          <option value="2010">2010–2019</option>
          <option value="2000">2000–2009</option>
          <option value="1990">1990–1999</option>
          <option value="older">Trước 1990</option>
        </select>
        <button type="button" class="cine-filter-clear" id="filterClear" hidden>Xóa lọc</button>
      </form>
      <form class="cine-search" id="searchForm" role="search">
        <label class="sr-only" for="globalSearch">Tìm phim hoặc diễn viên</label>
        <input
          id="globalSearch"
          type="search"
          placeholder="Tìm phim, diễn viên…"
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="searchDropdown"
          aria-expanded="false"
        />
        <ul id="searchDropdown" class="cine-search-drop" role="listbox" aria-label="Kết quả tìm kiếm" hidden></ul>
      </form>
      <div class="cine-header-end">
        <div class="cine-lang" id="titleLang">
          <button type="button" class="cine-lang-toggle" id="langToggle" aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu" aria-label="Ngôn ngữ tên phim">
            <span class="cine-flag" data-flag="vi" aria-hidden="true"></span>
          </button>
          <ul class="cine-lang-menu" id="langMenu" role="listbox" aria-label="Ngôn ngữ tên phim" hidden>
            <li role="none"><button type="button" role="option" data-lang="vi"><span class="cine-flag" data-flag="vi" aria-hidden="true"></span>Tiếng Việt</button></li>
            <li role="none"><button type="button" role="option" data-lang="en"><span class="cine-flag" data-flag="en" aria-hidden="true"></span>English</button></li>
            <li role="none"><button type="button" role="option" data-lang="ko"><span class="cine-flag" data-flag="ko" aria-hidden="true"></span>한국어</button></li>
          </ul>
        </div>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Chuyển giao diện sáng / tối">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 14.3A8.5 8.5 0 0 1 9.7 3 7 7 0 1 0 21 14.3z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <span class="sr-only">Đổi theme</span>
        </button>
      </div>
    </div>
  </header>

  <main id="browseMain" class="cine-main">
    <section class="cine-hero" id="hero" aria-roledescription="carousel" aria-label="Đề xuất hôm nay">
      <div class="cine-hero-stage" id="heroStage" aria-hidden="true">
        <div class="cine-hero-bg is-front">
          <div class="cine-hero-blur"></div>
          <img class="cine-hero-poster" alt="" hidden />
        </div>
        <div class="cine-hero-bg">
          <div class="cine-hero-blur"></div>
          <img class="cine-hero-poster" alt="" hidden />
        </div>
      </div>
      <div class="cine-hero-shade" aria-hidden="true"></div>
      <button type="button" class="cine-hero-nav cine-hero-prev" id="heroPrev" aria-label="Phim trước">‹</button>
      <button type="button" class="cine-hero-nav cine-hero-next" id="heroNext" aria-label="Phim sau">›</button>
      <div class="cine-hero-copy" id="heroSlide" role="group" aria-roledescription="slide">
        <p class="cine-kicker" id="heroKicker">Đề xuất hôm nay <span id="heroCount"></span></p>
        <h1 id="heroTitle">—</h1>
        <p class="cine-hero-meta" id="heroMeta"></p>
        <p class="cine-hero-overview" id="heroOverview"></p>
        <div class="cine-hero-actions">
          <button type="button" class="cine-btn cine-btn-primary" id="heroOpen">Xem chi tiết</button>
          <button type="button" class="cine-btn cine-btn-ghost" id="heroCast">Dàn diễn viên</button>
        </div>
      </div>
      <div class="cine-hero-dots" id="heroDots" role="group" aria-label="Chọn phim đề xuất"></div>
    </section>

    <div class="cine-rows" id="rows" aria-live="polite"></div>
  </main>

  <dialog class="cine-modal" id="detailModal" aria-labelledby="detailTitle">
    <div class="cine-modal-inner">
      <button type="button" class="cine-modal-close" id="btnCloseDetail" aria-label="Đóng">×</button>
      <div class="cine-modal-media" id="detailPoster" data-kind="movie" aria-hidden="true">
        <div class="cine-modal-media-blur" id="detailPosterBlur"></div>
        <img class="cine-modal-media-img" id="detailPosterImg" alt="" hidden />
        <div class="cine-modal-media-fallback" id="detailPosterFallback" hidden></div>
      </div>
      <div class="cine-modal-body">
        <p class="cine-kicker" id="detailKicker"></p>
        <h2 id="detailTitle"></h2>
        <p class="cine-hero-meta" id="detailMeta"></p>
        <dl class="cine-stats" id="detailStats"></dl>
        <p class="cine-modal-overview" id="detailOverview"></p>
        <h3 class="cine-section-label" id="castSectionLabel">Diễn viên</h3>
        <div class="cine-cast-scroll" id="castScroll">
          <ul class="cine-cast" id="detailCast"></ul>
          <p class="cine-cast-more" id="castMore" hidden>Còn phía dưới</p>
        </div>
        <div id="detailActorExtras" hidden>
          <div class="actor-metrics">
            <div class="actor-metrics-head">
              <h3 class="cine-section-label">Độ đo mạng</h3>
              <a class="cine-btn cine-btn-ghost" id="linkGraphActor" href="index.html">Xem trên đồ thị SNA</a>
            </div>
            <dl class="cine-stats actor-metric-grid" id="detailActorStats"></dl>
          </div>
          <h3 class="cine-section-label">Các phim đã đóng</h3>
          <div class="cine-rail-wrap">
            <div class="cine-rail" id="actorFilmRail"></div>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <div id="loading" class="loading cine-loading" role="status">Đang kiểm tra dữ liệu…</div>
  <script src="common.js?v=ui10"></script>
  <script src="explore.js?v=ui7"></script>
</body>
</html>
